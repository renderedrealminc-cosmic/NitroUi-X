name: Build VisionOS Cosmic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout VisionOS Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4 Directly (No Cache Error)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          sudo unzip -q -d /opt/gradle gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload VisionOS Cosmic APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionOS-Cosmic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
